services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: alljobs-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - alljobs-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        echo "Running /scripts/000_create_database.sql"
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -b \
          -i /scripts/000_create_database.sql

        echo "Waiting for AllJobsDb to be ONLINE..."

        until /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$MSSQL_SA_PASSWORD" \
          -C \
          -b \
          -h -1 \
          -W \
          -Q "SET NOCOUNT ON; SELECT state_desc FROM sys.databases WHERE name = N'AllJobsDb';" \
          | grep -q "ONLINE"
        do
          sleep 1
        done

        for f in /scripts/*.sql; do
          if [ "$$f" = "/scripts/000_create_database.sql" ]; then
            continue
          fi

          echo "Running $$f"
          /opt/mssql-tools18/bin/sqlcmd \
            -S sqlserver \
            -U sa \
            -P "$$MSSQL_SA_PASSWORD" \
            -C \
            -b \
            -i "$$f"
        done

  api:
    build:
      context: .
      dockerfile: src/AllJobs.Api/Dockerfile
    container_name: alljobs-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AllJobsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: alljobs-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_started

volumes:
  alljobs-sql-data:
